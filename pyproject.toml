[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Kaggle: Biohub - Cell Tracking During Development (working repository)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=1.36",
    "scipy>=1.12",
    "scikit-image>=0.24",
    "zarr>=3.0.10,<4",
    "blosc2",
    "geff>=1.1.3",
    # Same source as the official baseline (royerlab). metrics.py / division_metrics.py
    # only need polars + tracksdata, so torch is NOT required locally.
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
    "kaggle>=1.6",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "official/src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["official", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Port of a public Kaggle notebook cell (see src/biohub/public_postproc docstrings):
# kept close to the original line breaks on purpose, so long lines are allowed
# here instead of reflowing the ported logic.
"src/biohub/public_postproc/*.py" = ["E501"]
